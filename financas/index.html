<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borges Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>

<div class="app-root">
  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand-mark">B</div>
      <nav class="nav" id="nav">
        <button class="nav-btn" data-tab="dashboard" title="Dashboard">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        </button>
        <button class="nav-btn" data-tab="transacoes" title="Transações">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16m0 0-3-3m3 3 3-3"/><path d="M17 20V4m0 0-3 3m3-3 3 3"/></svg>
        </button>
        <button class="nav-btn" data-tab="categorias" title="Categorias">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        </button>
        <button class="nav-btn" data-tab="cartoes" title="Cartões">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 9.5h19"/></svg>
        </button>
        <button class="nav-btn" data-tab="pj" title="PJ / Impostos">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/></svg>
        </button>
        <button class="nav-btn" data-tab="insights" title="Insights IA">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z"/></svg>
        </button>
        <button class="nav-btn" data-tab="config" title="Configurações">
          <span class="nav-active-bg"></span>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9 17 7m-10 10-2.1 2.1"/></svg>
        </button>
      </nav>
      <div class="avatar" id="avatar">LB</div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="app-header">
        <div>
          <div class="kicker" id="kicker">Visão geral</div>
          <h1 class="title" id="title">Dashboard</h1>
        </div>
        <div class="flex-row">
          <div class="hchip">
            <span class="dot" style="background:var(--purple)"></span>
            <span>PF</span>
            <span class="sep"></span>
            <span class="dot" style="background:var(--yellow)"></span>
            <span>PJ</span>
          </div>
          <div class="hchip-month">
            <select id="month-picker"></select>
          </div>
        </div>
      </header>

      <section id="page-dashboard" class="page"></section>
      <section id="page-transacoes" class="page hidden"></section>
      <section id="page-categorias" class="page hidden"></section>
      <section id="page-cartoes" class="page hidden"></section>
      <section id="page-pj" class="page hidden"></section>
      <section id="page-insights" class="page hidden"></section>
      <section id="page-config" class="page hidden"></section>
    </main>

    <!-- IMPORT REVIEW MODAL -->
    <div class="modal-bg" id="import-modal">
      <div class="modal">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
          <div>
            <h3>Importar extrato</h3>
            <p class="sub" id="import-sub"></p>
          </div>
          <button class="modal-close" onclick="app.closeImport()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin:18px 0;" id="import-list"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div class="flex-row" style="gap:8px;">
            <button class="btn" onclick="app.importToggleAll(true)">Marcar todas</button>
            <button class="btn" onclick="app.importToggleAll(false)">Desmarcar</button>
            <button class="btn" onclick="app.importExcludeDupes()">Sem duplicadas</button>
          </div>
          <div class="flex-row" style="gap:10px;">
            <button class="btn" onclick="app.closeImport()">Cancelar</button>
            <button class="btn-primary btn" onclick="app.confirmImport()" id="import-confirm-btn">Confirmar import</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
